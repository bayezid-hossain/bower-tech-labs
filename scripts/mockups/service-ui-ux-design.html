<!doctype html>
<html style="--w:1116px;--h:728px">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="shared.css" />
<style>
  body { background: linear-gradient(120deg, #f4f9fc 0%, #e4f0f7 50%, #cfe4f0 100%); }
  .blueprint { position: absolute; left: 0; top: 0; bottom: 0; width: 560px;
    background-image: linear-gradient(rgba(30,102,214,.08) 1px, transparent 1px), linear-gradient(90deg, rgba(30,102,214,.08) 1px, transparent 1px);
    background-size: 24px 24px;
    -webkit-mask-image: linear-gradient(90deg, #000 55%, transparent); mask-image: linear-gradient(90deg, #000 55%, transparent); }
  .phone { width: 272px; height: 560px; border-radius: 46px; padding: 10px; top: 84px; }
  .phone .screen { border-radius: 37px; }
  .phone .island { width: 80px; height: 24px; }
  .wf { left: 220px; transform: rotate(-6deg); background: #fff; box-shadow: 0 24px 50px -24px rgba(0,56,83,.3); border: 2px dashed #9fbcd0; }
  .wf .screen { background: #fbfdfe; }
  .wf .island { background: #d4e2ea; }
  .g { background: #e2ebf1; border-radius: 8px; }
  .gx { border: 2px solid #d0dde5; border-radius: 12px; position: relative; overflow: hidden; }
  .gx::before, .gx::after { content: ""; position: absolute; left: 50%; top: 50%; width: 120%; height: 2px; background: #d0dde5; transform: translate(-50%,-50%) rotate(24deg); }
  .gx::after { transform: translate(-50%,-50%) rotate(-24deg); }
  .ui { left: 640px; transform: rotate(3deg); z-index: 2; }
  .ui .screen { font-size: 12px; }
  .note { position: absolute; font-size: 13px; font-weight: 600; color: var(--accent); display: flex; align-items: center; gap: 8px; }
  .note i { width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: #fff; font-style: normal; font-size: 11px; display: grid; place-items: center; }
  .chip { position: absolute; background: #fff; border-radius: 14px; box-shadow: var(--shadow-md); padding: 12px 14px; z-index: 3; font-size: 12px; }
  .lesson { display: flex; gap: 10px; align-items: center; padding: 10px; border-radius: 14px; background: #f5f9fc; margin-bottom: 8px; }
  .lesson .th { width: 40px; height: 40px; border-radius: 12px; flex: none; display: grid; place-items: center; color: #fff; font-weight: 700; }
  .prog { height: 5px; border-radius: 4px; background: #e2ebf1; margin-top: 6px; overflow: hidden; }
  .prog span { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
</style>
</head>
<body>
<div class="blueprint"></div>

<div class="note" style="left:64px;top:92px"><i>1</i>Wireframe</div>
<div class="note" style="left:960px;top:92px"><i>2</i>Final UI</div>

<!-- Wireframe -->
<div class="phone wf"><div class="screen"><span class="island"></span>
  <div style="padding:52px 18px 0">
    <div class="row gap-10" style="margin-bottom:16px"><div class="g" style="width:36px;height:36px;border-radius:50%"></div><div class="grow"><div class="g" style="height:8px;width:60%"></div><div class="g" style="height:10px;width:85%;margin-top:6px"></div></div></div>
    <div class="gx" style="height:150px"></div>
    <div class="g" style="height:10px;width:50%;margin:18px 0 12px"></div>
    <div class="row gap-10" style="margin-bottom:10px"><div class="gx" style="width:40px;height:40px"></div><div class="grow"><div class="g" style="height:8px;width:80%"></div><div class="g" style="height:6px;width:100%;margin-top:8px"></div></div></div>
    <div class="row gap-10" style="margin-bottom:10px"><div class="gx" style="width:40px;height:40px"></div><div class="grow"><div class="g" style="height:8px;width:70%"></div><div class="g" style="height:6px;width:100%;margin-top:8px"></div></div></div>
    <div class="row gap-10"><div class="gx" style="width:40px;height:40px"></div><div class="grow"><div class="g" style="height:8px;width:76%"></div><div class="g" style="height:6px;width:100%;margin-top:8px"></div></div></div>
  </div>
</div></div>

<!-- Arrow -->
<svg class="abs" style="left:500px;top:290px;z-index:4" width="190" height="120" viewBox="0 0 190 120" fill="none">
  <path d="M8 90 C50 20 100 14 130 44" stroke="#1e66d6" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round"/>
  <path d="M116 34 L134 50 L110 58" stroke="#1e66d6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>

<!-- Final UI -->
<div class="phone ui"><div class="screen"><span class="island"></span>
  <div class="status"><span>9:41</span><span class="sig"><b></b><i></i></span></div>
  <div style="padding:0 18px">
    <div class="row gap-10" style="margin:4px 0 14px"><span class="av a3" style="width:36px;height:36px"></span><div><div class="muted" style="font-size:10.5px">Hi Priya</div><b style="font-size:14px">Keep learning today</b></div></div>
    <div style="border-radius:20px;padding:16px;color:#fff;background:linear-gradient(140deg,#1e66d6,#003853);position:relative;overflow:hidden;height:150px">
      <svg class="abs" style="right:-20px;bottom:-24px;opacity:.25" width="150" height="150" viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="none" stroke="#fff" stroke-width="10"/><circle cx="50" cy="50" r="18" fill="#fff"/></svg>
      <span class="pill" style="background:rgba(255,255,255,.18);color:#fff;font-size:10px;padding:3px 9px">Continue · Lesson 4</span>
      <div style="font-size:18px;font-weight:800;letter-spacing:-0.02em;margin-top:10px;line-height:1.15">Design Systems<br/>Foundations</div>
      <div style="position:absolute;left:16px;right:16px;bottom:16px"><div class="row between" style="font-size:10.5px;opacity:.85"><span>68% complete</span><span>12 min left</span></div><div class="prog" style="background:rgba(255,255,255,.25)"><span style="width:68%;background:#fff"></span></div></div>
    </div>
    <div class="row between" style="margin:16px 0 10px"><b style="font-size:14px">Up next</b><span style="color:var(--accent);font-weight:600;font-size:11px">View all</span></div>
    <div class="lesson"><span class="th" style="background:#1e66d6">Aa</span><div class="grow"><b>Type scales</b><div class="prog"><span style="width:40%"></span></div></div></div>
    <div class="lesson"><span class="th" style="background:#003853">◐</span><div class="grow"><b>Color tokens</b><div class="prog"><span style="width:15%"></span></div></div></div>
    <div class="lesson"><span class="th" style="background:#7fb0ee">▦</span><div class="grow"><b>Layout grids</b><div class="prog"><span style="width:0%"></span></div></div></div>
  </div>
  <span class="homebar"></span>
</div></div>

<div class="chip" style="left:900px;top:440px;transform:rotate(-3deg)">
  <div class="muted caps" style="font-size:9.5px;margin-bottom:6px">Components</div>
  <div class="row gap-6"><span class="btn primary" style="height:28px;font-size:11px;padding:0 12px">Primary</span><span class="btn ghost" style="height:28px;font-size:11px;padding:0 12px">Ghost</span></div>
</div>
<div class="chip" style="left:470px;top:590px;transform:rotate(2deg)">
  <div class="row gap-8"><span style="width:22px;height:22px;border-radius:7px;background:#1e66d6"></span><span style="width:22px;height:22px;border-radius:7px;background:#003853"></span><span style="width:22px;height:22px;border-radius:7px;background:#c0dceb"></span><b style="font-size:18px;margin-left:6px">Aa</b><span class="muted">Inter</span></div>
</div>
</body>
</html>
