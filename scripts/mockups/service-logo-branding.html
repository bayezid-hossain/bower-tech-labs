<!doctype html>
<html style="--w:1116px;--h:728px">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="shared.css" />
<style>
  .board { position: absolute; left: 70px; top: 74px; width: 580px; height: 580px; border-radius: 28px; background: #04293d; border: 1px solid rgba(255,255,255,.08); box-shadow: 0 40px 80px -30px rgba(0,0,0,.6); overflow: hidden; }
  .board .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(192,220,235,.07) 1px, transparent 1px), linear-gradient(90deg, rgba(192,220,235,.07) 1px, transparent 1px); background-size: 29px 29px; background-position: 0 0; }
  .lbl { position: absolute; font-size: 11px; font-weight: 600; color: #7fb0ee; letter-spacing: .04em; }
  .right { position: absolute; left: 700px; top: 74px; width: 346px; color: #fff; }
  .sw { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 26px; }
  .sw div { border-radius: 16px; height: 118px; padding: 14px; display: flex; flex-direction: column; justify-content: flex-end; font-size: 12px; }
  .sw b { font-size: 14px; display: block; }
  .type { margin-top: 14px; border-radius: 16px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1); padding: 16px 18px; display: flex; align-items: center; gap: 18px; }
</style>
</head>
<body class="bg-navy">
<div class="stage bg-navy grid-dots"></div>

<div class="board">
  <div class="grid"></div>
  <svg class="abs" style="inset:0" width="580" height="580" viewBox="0 0 580 580" fill="none">
    <!-- construction -->
    <g stroke="rgba(192,220,235,.35)" stroke-width="1">
      <rect x="130" y="130" width="320" height="320"/>
      <line x1="290" y1="60" x2="290" y2="520"/><line x1="60" y1="290" x2="520" y2="290"/>
      <line x1="100" y1="100" x2="480" y2="480"/><line x1="480" y1="100" x2="100" y2="480"/>
      <circle cx="290" cy="290" r="226"/>
      <circle cx="450" cy="450" r="160"/><circle cx="130" cy="130" r="160" stroke-dasharray="4 6"/>
      <circle cx="370" cy="210" r="80"/>
    </g>
    <!-- mark -->
    <path d="M130 290 A160 160 0 0 1 290 130 L290 290 Z" fill="#1e66d6"/>
    <circle cx="370" cy="210" r="72" fill="#ffffff"/>
    <rect x="138" y="298" width="144" height="144" rx="26" fill="#c0dceb"/>
    <path d="M298 298 L450 298 A152 152 0 0 1 298 450 Z" fill="#1e66d6"/>
    <!-- anchors -->
    <g fill="#04293d" stroke="#7fb0ee" stroke-width="2">
      <circle cx="130" cy="130" r="5"/><circle cx="450" cy="130" r="5"/><circle cx="130" cy="450" r="5"/><circle cx="450" cy="450" r="5"/><circle cx="290" cy="290" r="5"/><circle cx="370" cy="210" r="5"/>
    </g>
    <!-- dimension -->
    <g stroke="#7fb0ee" stroke-width="1.5"><line x1="130" y1="486" x2="450" y2="486"/><line x1="130" y1="478" x2="130" y2="494"/><line x1="450" y1="478" x2="450" y2="494"/>
      <line x1="486" y1="130" x2="486" y2="290"/><line x1="478" y1="130" x2="494" y2="130"/><line x1="478" y1="290" x2="494" y2="290"/></g>
  </svg>
  <div class="lbl" style="left:274px;top:494px">4X</div>
  <div class="lbl" style="left:500px;top:202px">2X</div>
  <div class="lbl" style="left:24px;top:22px;color:rgba(255,255,255,.55)">LOGOMARK · CONSTRUCTION</div>
  <div class="lbl" style="right:24px;top:22px;color:rgba(255,255,255,.55)">GRID 8PT</div>
</div>

<div class="right">
  <div class="row gap-12"><svg width="40" height="40" viewBox="130 130 320 320"><path d="M130 290 A160 160 0 0 1 290 130 L290 290 Z" fill="#1e66d6"/><circle cx="370" cy="210" r="72" fill="#fff"/><rect x="138" y="298" width="144" height="144" rx="26" fill="#c0dceb"/><path d="M298 298 L450 298 A152 152 0 0 1 298 450 Z" fill="#1e66d6"/></svg>
    <div><div style="font-size:24px;font-weight:800;letter-spacing:-0.03em">Quadra</div><div style="font-size:12.5px;opacity:.6">Brand guidelines · v2.0</div></div></div>
  <div class="sw">
    <div style="background:#1e66d6"><b>Signal Blue</b><span style="opacity:.8">#1E66D6 · Primary</span></div>
    <div style="background:#c0dceb;color:#003853"><b>Mist</b><span style="opacity:.8">#C0DCEB · Surface</span></div>
    <div style="background:#f6fcff;color:#003853"><b>Paper</b><span style="opacity:.7">#F6FCFF · Base</span></div>
    <div style="background:#001b25;border:1px solid rgba(255,255,255,.14)"><b>Ink</b><span style="opacity:.7">#001B25 · Text</span></div>
  </div>
  <div class="type">
    <div style="font-size:54px;font-weight:800;letter-spacing:-0.04em;line-height:1">Aa</div>
    <div style="font-size:12.5px;line-height:1.6"><b style="font-size:15px">Inter Display</b><br/><span style="opacity:.6">Bold · Semibold · Regular</span><br/><span style="opacity:.6">ABCDEFG 0123456789</span></div>
  </div>
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px">
    <div style="height:122px;border-radius:16px;background:#fff;display:grid;place-items:center"><svg width="52" height="52" viewBox="130 130 320 320"><path d="M130 290 A160 160 0 0 1 290 130 L290 290 Z" fill="#1e66d6"/><circle cx="370" cy="210" r="72" fill="#003853"/><rect x="138" y="298" width="144" height="144" rx="26" fill="#c0dceb"/><path d="M298 298 L450 298 A152 152 0 0 1 298 450 Z" fill="#1e66d6"/></svg></div>
    <div style="height:122px;border-radius:16px;background:#1e66d6;display:grid;place-items:center"><svg width="52" height="52" viewBox="130 130 320 320" fill="#fff"><path d="M130 290 A160 160 0 0 1 290 130 L290 290 Z"/><circle cx="370" cy="210" r="72"/><rect x="138" y="298" width="144" height="144" rx="26" opacity=".6"/><path d="M298 298 L450 298 A152 152 0 0 1 298 450 Z"/></svg></div>
    <div style="height:122px;border-radius:16px;background:#c0dceb;display:grid;place-items:center"><svg width="52" height="52" viewBox="130 130 320 320" fill="#003853"><path d="M130 290 A160 160 0 0 1 290 130 L290 290 Z"/><circle cx="370" cy="210" r="72"/><rect x="138" y="298" width="144" height="144" rx="26" opacity=".45"/><path d="M298 298 L450 298 A152 152 0 0 1 298 450 Z"/></svg></div>
  </div>
</div>
</body>
</html>
